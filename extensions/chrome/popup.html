<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width" />
  <title>DankMachine</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <img src="icons/icon-32.png" alt="" width="24" height="24" class="pixel" />
    <h1>DankMachine</h1>
    <a href="https://dankmachine.com/?ref=extension" target="_blank" rel="noopener" class="site">open site</a>
  </header>
  <label for="q" class="sr-only">Search meme sounds</label>
  <input id="q" type="search" placeholder="bruh, vine boom, sad violin..." autocomplete="off" autofocus />
  <nav id="tabs" aria-label="Lists">
    <button type="button" data-tab="trending" aria-pressed="true">Trending</button>
    <button type="button" data-tab="saved" aria-pressed="false">Saved</button>
  </nav>
  <p id="status" aria-live="polite"></p>
  <ul id="list"></ul>
  <footer>1-9 play the first nine. Shift+click copies the link. Right-click any text to find a sound for it.</footer>
  <script src="popup.js" type="module"></script>
</body>
</html>
