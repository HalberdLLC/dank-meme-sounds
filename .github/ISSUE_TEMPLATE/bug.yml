name: 🐛 Bug
description: Something does not work in the MCP server, CLI or extension
labels: ["bug"]
body:
  - type: dropdown
    id: surface
    attributes:
      label: Where
      options: ["Remote server (dankmachine.com/mcp)", "Local npm server", "play CLI / hooks", "Claude Code plugin", "Browser extension", "REST API"]
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Client and OS
      description: e.g. Claude Code 2.x on Windows 11, Cursor on macOS
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
